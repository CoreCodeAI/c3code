<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="teal" x1="20" y1="0" x2="108" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F5552"/>
      <stop offset="1" stop-color="#0A1F22"/>
    </linearGradient>
    <radialGradient id="mint" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(22 16) rotate(50) scale(100)">
      <stop stop-color="#5EEAD4" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.7" fill="#FFF8F2" fill-opacity="0.18"/>
    </pattern>
    <clipPath id="tile">
      <rect width="128" height="128" rx="10"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="128" height="128" fill="url(#teal)"/>
    <rect width="128" height="128" fill="url(#mint)"/>
    <rect width="128" height="128" fill="url(#grid)"/>
  </g>
</svg>
